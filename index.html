<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdallah | Terminal Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="Abdallah Mohammed — Flutter Developer. Cairo University Computer Science graduate specialising in Clean Architecture and SOLID principles.">

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Matrix rain canvas — sits behind everything -->
    <canvas id="matrix-bg"></canvas>

    <div class="crt-overlay"></div>

    <div class="terminal-container">
        <div class="terminal-header">
            <div class="buttons">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
            </div>
            <div class="title" id="terminal-title">user@cairo-university: ~/home</div>
        </div>

        <div class="terminal-body">
            <aside class="sidebar">
                <div class="sidebar-label">DIRECTORY</div>
                <ul class="nav-links">
                    <li class="nav-item" data-target="home">
                        <span class="icon">_></span> Home
                    </li>
                    <li class="nav-item" data-target="projects">
                        <span class="icon">📂</span> Projects
                    </li>
                    <li class="nav-item" data-target="skills">
                        <span class="icon">⚡</span> Skills
                    </li>
                    <li class="nav-item" data-target="experience">
                        <span class="icon">💼</span> Experience
                    </li>
                    <li class="nav-item" data-target="certifications">
                        <span class="icon">🏆</span> Certifications
                    </li>
                    <li class="nav-item" data-target="contact">
                        <span class="icon">📫</span> Contact
                    </li>
                </ul>
            </aside>

            <main class="content-wrapper" id="main-content"></main>
        </div>

        <div class="status-bar">
            <div class="status-left">NORMAL</div>
            <div class="status-right">
                <span>utf-8</span>
                <span>unix</span>
                <span class="ln-col">Ln 1, Col 1</span>
            </div>
        </div>
    </div>

    <!-- External libs (non-module, loaded before our module) -->
    <script src="https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <!-- Matrix rain (plain script, not a module) -->
    <script src="js/matrix.js"></script>

    <!-- Main entry point as an ES module -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
